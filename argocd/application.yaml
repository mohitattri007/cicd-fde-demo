apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: support-agent-api
  namespace: argocd
spec:
  project: default
  source:
    # Replace with your deployment-config repository URL.
    repoURL: https://github.com/your-org/platform-deployments.git
    targetRevision: main
    path: apps/support-agent-api
  destination:
    server: https://kubernetes.default.svc
    namespace: support-agent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
